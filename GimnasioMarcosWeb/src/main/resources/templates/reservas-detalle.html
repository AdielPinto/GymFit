<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle de reservas - GymFit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <h2 class="mb-4">Detalle de reservas - GymFit</h2>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-bordered">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Cliente</th>
                            <th>DNI</th>
                            <th>Entrenador</th>
                            <th>Especialidad</th>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="r : ${reservasDetalle}">
                            <td th:text="${r.id}"></td>
                            <td th:text="${r.cliente}"></td>
                            <td th:text="${r.dni}"></td>
                            <td th:text="${r.entrenador}"></td>
                            <td th:text="${r.especialidad}"></td>
                            <td th:text="${r.fecha}"></td>
                            <td th:text="${r.hora}"></td>
                            <td th:text="${r.estado}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <a href="/reservas" class="btn btn-secondary">Volver a reservas</a>
        </div>
    </div>
</div>

</body>
</html>
